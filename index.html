<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00ff85">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SRAZU - Crypto Price Action</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div id="app">
        <div id="charts">
            <div class="chart-wrapper">
                <div class="chart-title" id="title-5m">
                    <span class="title-bell" style="display:inline-block; margin-right:8px; position:relative; z-index:10; font-size:22px;">🔔</span>
                    <span class="title-ruler" style="display:inline-block; margin-left:30px; cursor:pointer; opacity:0.5; position:relative; z-index:10; font-size:22px;">📏</span>
                    <span class="title-pct" style="display:inline-block; margin-left:10px; font-size:16px; font-weight:bold; color:#00ff85; position:relative; z-index:10;"></span>
                    <span class="title-text" style="font-size:18px; font-weight:bold;">Loading...</span>
                    <span class="title-fullscreen" style="float:right; position:relative; z-index:10; font-size:26px; line-height:1;">⛶</span>
                </div>
                <div id="chart-5m" class="chart-container"></div>
            </div>
            <div class="chart-wrapper">
                <div class="chart-title" id="title-30m">
                    <span class="title-bell" style="display:inline-block; margin-right:8px; position:relative; z-index:10; font-size:22px;">🔔</span>
                    <span class="title-ruler" style="display:inline-block; margin-left:30px; cursor:pointer; opacity:0.5; position:relative; z-index:10; font-size:22px;">📏</span>
                    <span class="title-pct" style="display:inline-block; margin-left:10px; font-size:16px; font-weight:bold; color:#00ff85; position:relative; z-index:10;"></span>
                    <span class="title-text" style="font-size:18px; font-weight:bold;">Loading...</span>
                    <span class="title-fullscreen" style="float:right; position:relative; z-index:10; font-size:26px; line-height:1;">⛶</span>
                </div>
                <div id="chart-30m" class="chart-container"></div>
            </div>
            <div class="chart-wrapper">
                <div class="chart-title" id="title-4h">
                    <span class="title-bell" style="display:inline-block; margin-right:8px; position:relative; z-index:10; font-size:22px;">🔔</span>
                    <span class="title-ruler" style="display:inline-block; margin-left:30px; cursor:pointer; opacity:0.5; position:relative; z-index:10; font-size:22px;">📏</span>
                    <span class="title-pct" style="display:inline-block; margin-left:10px; font-size:16px; font-weight:bold; color:#00ff85; position:relative; z-index:10;"></span>
                    <span class="title-text" style="font-size:18px; font-weight:bold;">Loading...</span>
                    <span class="title-fullscreen" style="float:right; position:relative; z-index:10; font-size:26px; line-height:1;">⛶</span>
                </div>
                <div id="chart-4h" class="chart-container"></div>
            </div>
            <div class="chart-wrapper">
                <div class="chart-title" id="title-1d">
                    <span class="title-bell" style="display:inline-block; margin-right:8px; position:relative; z-index:10; font-size:22px;">🔔</span>
                    <span class="title-ruler" style="display:inline-block; margin-left:30px; cursor:pointer; opacity:0.5; position:relative; z-index:10; font-size:22px;">📏</span>
                    <span class="title-pct" style="display:inline-block; margin-left:10px; font-size:16px; font-weight:bold; color:#00ff85; position:relative; z-index:10;"></span>
                    <span class="title-text" style="font-size:18px; font-weight:bold;">Loading...</span>
                    <span class="title-fullscreen" style="float:right; position:relative; z-index:10; font-size:26px; line-height:1;">⛶</span>
                </div>
                <div id="chart-1d" class="chart-container"></div>
            </div>
        </div>

        <div id="pairs">
            <div class="pairs-header">
                <div class="header-left">
                    <select id="exchange-select">
                        <option value="bybit">Bybit</option>
                        <option value="binance">Binance</option>
                    </select>
                    <span>Perpetual Pairs</span>
                    <span id="info-btn">i</span>
                </div>
                <div class="header-right">
                    <select id="sort-select">
                        <option value="volume">By Volume</option>
                        <option value="gainers">Top Gainers 24h</option>
                        <option value="losers">Top Losers 24h</option>
                    </select>
                    <button id="settings-btn">⚙️ Settings</button>
                </div>
            </div>
            <div id="pairs-list"><div class="loading">Loading pairs...</div></div>
        </div>
    </div>

    <!-- Modals (identici ai tuoi) -->
    <div id="settings-modal" class="modal"> ... (tutto il tuo codice dei modali che avevi prima) ... </div>
    <div id="info-modal" class="modal"> ... </div>
    <div id="alert-setup" style="display:none; ..."> ... </div>
    <div id="fullscreen-overlay" style="display:none; ..."> ... </div>

    <script src="app.js"></script>
</body>
</html>
